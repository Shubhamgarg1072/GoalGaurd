kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
ktor-plugin = { id = "io.ktor.plugin", version.ref = "ktor" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

# Convention Plugins
goalguard-android-application = { id = "goalguard.android.application", version = "unspecified" }
goalguard-android-library = { id = "goalguard.android.library", version = "unspecified" }
goalguard-android-feature = { id = "goalguard.android.feature", version = "unspecified" }
goalguard-android-compose = { id = "goalguard.android.compose", version = "unspecified" }
goalguard-domain-module = { id = "goalguard.domain.module", version = "unspecified" }
